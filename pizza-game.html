<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תפוס את הפיצה! 🍕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a0a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow-x: auto;
    }

    /* ── Game wrapper (canvas + side leaderboard) ── */
    #gameWrapper {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    #canvasContainer { position: relative; }

    /* ── Persistent side leaderboard ── */
    #sideLeaderboard {
      width: 170px;
      flex-shrink: 0;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,107,0,0.45);
      border-radius: 12px;
      padding: 12px;
      direction: rtl;
      max-height: 350px;
      overflow-y: auto;
    }
    #sideLeaderboard h3 {
      color: #ffcc00;
      font-size: 14px;
      margin-bottom: 8px;
      text-align: center;
      white-space: nowrap;
    }
    #sideLeaderboard .lb-row {
      padding: 3px 0;
      font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      color: #ccc;
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }
    #sideLeaderboard .lb-row.highlight { color: #ffcc00; font-weight: bold; }
    #sideLeaderboard .lb-rank { color: #888; width: 22px; }
    #sideLeaderboard .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #sideLeaderboard .lb-score { color: #ff9944; white-space: nowrap; }
    #sideLeaderboard .empty-msg { color: #555; font-size: 12px; text-align: center; margin-top: 8px; }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      text-shadow: 0 0 20px #ff6b00;
      letter-spacing: 2px;
    }

    #hud {
      display: flex;
      gap: 30px;
      margin-bottom: 10px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    #hud span { color: #ffcc00; }

    #gameCanvas {
      border: 3px solid #ff6b00;
      border-radius: 10px;
      box-shadow: 0 0 30px #ff6b0088;
      background: #0d0d2b;
      display: block;
    }

    #overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(10,5,30,0.95);
      border-radius: 18px;
      padding: 40px 60px;
      border: 2px solid #ff6b00;
      box-shadow: 0 0 40px #ff6b0066;
      z-index: 100;
    }

    #overlay h2 { font-size: 2rem; color: #ffcc00; }
    #overlay p { font-size: 1rem; color: #ccc; text-align: center; max-width: 320px; }

    button {
      margin-top: 10px;
      padding: 12px 34px;
      font-size: 1.1rem;
      font-weight: bold;
      background: linear-gradient(135deg, #ff6b00, #ff3300);
      border: none;
      border-radius: 30px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 20px #ff6b0088;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:hover { transform: scale(1.07); box-shadow: 0 6px 28px #ff6b00bb; }

    #backBtn {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 8px 20px;
      font-size: 0.9rem;
      background: rgba(255,107,0,0.2);
      border: 1px solid #ff6b00;
      border-radius: 20px;
      color: #ff6b00;
      cursor: pointer;
      z-index: 999;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #backBtn:hover { background: rgba(255,107,0,0.4); }

    #instructions {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
    }

    /* ── Leaderboard ── */
    #leaderboard {
      margin-top: 12px;
      width: 300px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,107,0,0.4);
      border-radius: 10px;
      padding: 10px 14px;
      direction: rtl;
      max-height: 200px;
      overflow-y: auto;
    }
    #leaderboard h3 {
      color: #ffcc00;
      font-size: 15px;
      margin-bottom: 6px;
      text-align: center;
    }
    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: #ccc;
      font-size: 13px;
    }
    .lb-row.highlight { color: #ffcc00; font-weight: bold; }
    .lb-rank { width: 26px; color: #888; }
    .lb-name { flex: 1; }
    .lb-score { color: #ff9944; }

    /* ── Name input ── */
    #nameInputArea {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      direction: rtl;
    }
    #nameInputArea p { color: #ffcc00; font-size: 15px; font-weight: bold; }
    #nameInput {
      padding: 9px 16px;
      font-size: 15px;
      border-radius: 20px;
      border: 2px solid #ff6b00;
      background: rgba(10,5,30,0.9);
      color: #fff;
      text-align: center;
      width: 210px;
      outline: none;
    }
    #submitName {
      padding: 9px 26px;
      font-size: 14px;
      background: linear-gradient(135deg, #ff6b00, #ff3300);
      color: #fff;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }
    #submitName:hover { opacity: 0.85; }
  </style>
</head>
<body>

<a href="index.html" id="backBtn">🏠 חזרה לתפריט</a>

<h1>🍕 תפוס את הפיצה!</h1>
<div id="hud">
  <div>❤️ חיים: <span id="livesDisplay">3</span></div>
  <div>⭐ ניקוד: <span id="scoreDisplay">0</span></div>
  <div>📏 מרחק: <span id="distDisplay">0</span>m</div>
</div>

<div id="gameWrapper">
  <div id="canvasContainer">
    <canvas id="gameCanvas" width="800" height="350"></canvas>
    <div id="overlay">
      <h2>🍕 תפוס את הפיצה!</h2>
      <p>רוץ, קפוץ ושרוד את התוספות השגויות כדי להגיע לפיצה!</p>
      <p style="color:#ffcc00; font-size:0.9rem">⬆️ / Space = קפיצה &nbsp;|&nbsp; ⬇️ = שכיבה</p>
      <button id="startBtn">▶ התחל משחק</button>
    </div>
  </div>
  <div id="sideLeaderboard">
    <h3>🏆 טבלת שיאים</h3>
    <p class="empty-msg">אין שיאים עדיין!</p>
  </div>
</div>

<div id="instructions">חץ למעלה / רווח = קפיצה &nbsp;|&nbsp; חץ למטה = שכיבה</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const livesEl = document.getElementById('livesDisplay');
const scoreEl = document.getElementById('scoreDisplay');
const distEl = document.getElementById('distDisplay');

// ── Leaderboard helpers ──────────────────────────────────────────
const LB_KEY = 'pizzaGameLeaderboard';

function getLeaderboard() {
  try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch { return []; }
}
function saveLeaderboard(lb) { localStorage.setItem(LB_KEY, JSON.stringify(lb)); }
function isTopTen(score) {
  const lb = getLeaderboard();
  return lb.length < 10 || score > lb[lb.length - 1].score;
}
function addToLeaderboard(name, score) {
  const lb = getLeaderboard();
  lb.push({ name, score });
  lb.sort((a, b) => b.score - a.score);
  const trimmed = lb.slice(0, 10);
  saveLeaderboard(trimmed);
  return trimmed;
}
// ── Side leaderboard (always visible) ──────────────────────────
function refreshSideLeaderboard(highlightScore) {
  const sideEl = document.getElementById('sideLeaderboard');
  const lb = getLeaderboard();
  const medals = ['🥇','🥈','🥉'];
  if (lb.length === 0) {
    sideEl.innerHTML = '<h3>🏆 טבלת שיאים</h3><p class="empty-msg">אין שיאים עדיין!</p>';
    return;
  }
  sideEl.innerHTML = '<h3>🏆 טבלת שיאים</h3>' + lb.map((e, i) => {
    const hi = (highlightScore !== null && e.score === highlightScore) ? 'highlight' : '';
    const rank = medals[i] || `${i+1}.`;
    return `<div class="lb-row ${hi}">
      <span class="lb-rank">${rank}</span>
      <span class="lb-name">${e.name}</span>
      <span class="lb-score">${e.score.toLocaleString()}</span>
    </div>`;
  }).join('');
}

function renderLeaderboard(container, highlightScore) {
  const lb = getLeaderboard();
  if (lb.length === 0) { container.style.display = 'none'; return; }
  container.style.display = 'block';
  const medals = ['🥇','🥈','🥉'];
  container.innerHTML = '<h3>🏆 טבלת שיאים</h3>' + lb.map((e, i) => {
    const hi = e.score === highlightScore ? 'highlight' : '';
    const rank = medals[i] || `${i+1}.`;
    return `<div class="lb-row ${hi}">
      <span class="lb-rank">${rank}</span>
      <span class="lb-name">${e.name}</span>
      <span class="lb-score">${e.score.toLocaleString()}</span>
    </div>`;
  }).join('');
}

// ── Game state ──────────────────────────────────────────────
let gameRunning = false;
let animId;
let score = 0;
let lives = 3;
let distance = 0;
let speed = 5;
let frameCount = 0;
let gamePhase = 'running'; // 'running' | 'pizza'

// ── Ground ───────────────────────────────────────────────────
const GROUND_Y = 290;

// ── Player ───────────────────────────────────────────────────
const player = {
  x: 100,
  y: GROUND_Y,
  w: 44,
  h: 54,
  vy: 0,
  jumping: false,
  ducking: false,
  jumpCount: 0,
  invincible: 0,
  legPhase: 0,
};

function playerRect() {
  const bottom = player.y + player.h;
  if (player.ducking) {
    // כפוף: גוף נמוך — נחשף למכשולים על הקרקע, מגלש מתחת למעופפים
    // הגוף הכפוף מתחיל מ-y=260 (מעל מכשולי קרקע, מתחת למעופפים)
    return { x: player.x, y: bottom - 84, w: player.w + 8, h: 44 };
  }
  // עומד: מכסים את הגוף והראש
  return { x: player.x + 4, y: bottom - 88, w: player.w - 8, h: 72 };
}

// ── Obstacles ────────────────────────────────────────────────
const TOPPINGS = ['🍄','🫑','🧅','🫒','🌶️','🥩','🍍','🧀'];
let obstacles = [];
let obstacleTimer = 0;
let obstacleInterval = 90;

// ── Goal (pizza) ─────────────────────────────────────────────
let pizzaX = null;
const PIZZA_DISTANCE = 2000;

// ── Background stars ─────────────────────────────────────────
const stars = Array.from({length: 60}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * (GROUND_Y - 20),
  r: Math.random() * 2 + 0.5,
  twinkle: Math.random() * Math.PI * 2
}));

// ── Paralax BG layers ─────────────────────────────────────────
let bgX1 = 0, bgX2 = canvas.width;

// ── Input ─────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  if (!keys[e.code]) {
    keys[e.code] = true;
    if (['ArrowUp','Space'].includes(e.code)) {
      e.preventDefault();
      jump();
    }
    if (e.code === 'ArrowDown') player.ducking = true;
  }
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (e.code === 'ArrowDown') player.ducking = false;
});

// ── Jump ──────────────────────────────────────────────────────
function jump() {
  if (!gameRunning) return;
  if (player.jumpCount < 2) {
    player.vy = -15;
    player.jumping = true;
    player.jumpCount++;
  }
}

// ── Collision ─────────────────────────────────────────────────
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// ── Spawn obstacles ───────────────────────────────────────────
function spawnObstacle() {
  const type = Math.random() < 0.4 ? 'flying' : 'ground';
  const emoji = TOPPINGS[Math.floor(Math.random() * TOPPINGS.length)];
  const size = 36 + Math.floor(Math.random() * 16);
  const y = type === 'flying'
    ? GROUND_Y - 80 - Math.random() * 60
    : GROUND_Y + 4 - size;
  obstacles.push({ x: canvas.width + 20, y, w: size, h: size, emoji, type });
}

// ── Draw functions ────────────────────────────────────────────
function drawBackground() {
  // sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  grad.addColorStop(0, '#0d0d2b');
  grad.addColorStop(1, '#1a0a2e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, GROUND_Y);

  // stars
  stars.forEach(s => {
    s.twinkle += 0.04;
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(s.twinkle);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // ground
  ctx.fillStyle = '#2a1a4e';
  ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
  // ground line
  ctx.strokeStyle = '#6a3aaa';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(canvas.width, GROUND_Y);
  ctx.stroke();

  // distance markers
  ctx.fillStyle = '#4a2a7e';
  ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const mx = ((bgX1 + i * 100) % canvas.width + canvas.width) % canvas.width;
    ctx.fillRect(mx, GROUND_Y, 3, 10);
  }
  bgX1 -= speed * 0.3;
}

function drawPlayer() {
  const r = playerRect();
  if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2 === 0) return;

  ctx.save();
  ctx.translate(r.x + r.w / 2, r.y + r.h);

  player.legPhase += 0.25;

  if (player.ducking) {
    // body crouched
    ctx.fillStyle = '#e63946';
    ctx.fillRect(-22, -20, 44, 20);
    // head
    ctx.fillStyle = '#ffd6a5';
    ctx.beginPath();
    ctx.arc(0, -28, 14, 0, Math.PI * 2);
    ctx.fill();
    // cap
    ctx.fillStyle = '#e63946';
    ctx.fillRect(-12, -42, 24, 10);
    ctx.beginPath();
    ctx.arc(0, -40, 14, Math.PI, 0);
    ctx.fill();
    // eyes
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-5,-27,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(7,-27,3,0,Math.PI*2); ctx.fill();
    // mustache
    ctx.fillStyle = '#5c3d11';
    ctx.fillRect(-8, -22, 16, 4);
  } else {
    // legs
    const legSwing = Math.sin(player.legPhase) * 10;
    if (!player.jumping) {
      ctx.fillStyle = '#3d1a78';
      ctx.fillRect(-16, -20 + legSwing, 13, 20);
      ctx.fillRect(3, -20 - legSwing, 13, 20);
      // shoes
      ctx.fillStyle = '#111';
      ctx.fillRect(-18, -4 + legSwing, 16, 8);
      ctx.fillRect(2, -4 - legSwing, 16, 8);
    } else {
      ctx.fillStyle = '#3d1a78';
      ctx.fillRect(-16, -14, 13, 14);
      ctx.fillRect(3, -14, 13, 14);
      ctx.fillStyle = '#111';
      ctx.fillRect(-18, -2, 16, 8);
      ctx.fillRect(2, -2, 16, 8);
    }

    // body
    ctx.fillStyle = '#e63946';
    ctx.fillRect(-20, -54, 40, 36);
    // overalls
    ctx.fillStyle = '#3d1a78';
    ctx.fillRect(-18, -42, 36, 24);
    // overall straps
    ctx.fillRect(-14, -54, 8, 14);
    ctx.fillRect(6, -54, 8, 14);
    // buttons
    ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.arc(-8, -36, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -36, 3, 0, Math.PI*2); ctx.fill();

    // head
    ctx.fillStyle = '#ffd6a5';
    ctx.beginPath();
    ctx.arc(2, -62, 16, 0, Math.PI * 2);
    ctx.fill();

    // cap
    ctx.fillStyle = '#e63946';
    ctx.fillRect(-12, -80, 28, 12);
    ctx.beginPath();
    ctx.arc(2, -78, 16, Math.PI, 0);
    ctx.fill();
    // cap brim
    ctx.fillRect(-16, -68, 36, 6);

    // eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4,-63,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10,-63,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(-3,-63,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(11,-63,3,0,Math.PI*2); ctx.fill();

    // mustache
    ctx.fillStyle = '#5c3d11';
    ctx.beginPath();
    ctx.ellipse(-4, -56, 7, 4, -0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(10, -56, 7, 4, 0.3, 0, Math.PI*2);
    ctx.fill();

    // arms
    const armSwing = Math.sin(player.legPhase) * 12;
    ctx.fillStyle = '#e63946';
    ctx.save();
    ctx.translate(-22, -46);
    ctx.rotate((armSwing * Math.PI) / 180);
    ctx.fillRect(-4, 0, 8, 22);
    ctx.restore();
    ctx.save();
    ctx.translate(22, -46);
    ctx.rotate((-armSwing * Math.PI) / 180);
    ctx.fillRect(-4, 0, 8, 22);
    ctx.restore();
  }

  ctx.restore();
}

function drawObstacles() {
  obstacles.forEach(ob => {
    ctx.font = ob.h + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    // spin
    ctx.save();
    ctx.translate(ob.x + ob.w / 2, ob.y + ob.h);
    ctx.rotate((frameCount * 0.05) % (Math.PI * 2));
    ctx.fillText(ob.emoji, 0, 0);
    ctx.restore();
  });
}

function drawPizza() {
  if (pizzaX === null) return;
  const py = GROUND_Y - 70;
  ctx.font = '64px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  // floating bob
  const bob = Math.sin(frameCount * 0.06) * 6;
  // glow
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = 20 + Math.abs(Math.sin(frameCount * 0.06)) * 10;
  ctx.fillText('🍕', pizzaX, py + bob);
  ctx.shadowBlur = 0;
}

function drawDistanceBar() {
  const pct = Math.min(distance / PIZZA_DISTANCE, 1);
  const bw = 600, bh = 12, bx = 100, by = 10;
  ctx.fillStyle = '#2a1a4e';
  ctx.roundRect(bx, by, bw, bh, 6);
  ctx.fill();
  const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  grad.addColorStop(0, '#e63946');
  grad.addColorStop(1, '#ffcc00');
  ctx.fillStyle = grad;
  ctx.roundRect(bx, by, bw * pct, bh, 6);
  ctx.fill();
  // pizza icon on bar
  ctx.font = '16px serif';
  ctx.textAlign = 'center';
  ctx.fillText('🍕', bx + bw + 14, by + 12);
  // runner icon
  ctx.fillText('🏃', bx + bw * pct, by + 12);
}

// ── Update ────────────────────────────────────────────────────
function update() {
  frameCount++;
  distance += speed * 0.05;
  score += Math.ceil(speed * 0.1);

  // speed ramp
  if (frameCount % 300 === 0 && speed < 14) speed += 0.5;

  // gravity
  player.vy += 0.7;
  player.y += player.vy;
  if (player.y >= GROUND_Y) {
    player.y = GROUND_Y;
    player.vy = 0;
    player.jumping = false;
    player.jumpCount = 0;
  }

  if (player.invincible > 0) player.invincible--;

  // obstacles
  obstacleTimer++;
  if (obstacleTimer >= obstacleInterval) {
    obstacleTimer = 0;
    obstacleInterval = Math.max(40, 90 - Math.floor(distance / 100) * 3);
    if (distance < PIZZA_DISTANCE - 200) spawnObstacle();
  }

  obstacles.forEach(ob => ob.x -= speed);
  obstacles = obstacles.filter(ob => ob.x > -80);

  // collision
  if (player.invincible === 0) {
    const pr = playerRect();
    for (const ob of obstacles) {
      const hitbox = { x: ob.x + 6, y: ob.y + 6, w: ob.w - 12, h: ob.h - 12 };
      if (rectsOverlap(pr, hitbox)) {
        lives--;
        livesEl.textContent = lives;
        player.invincible = 80;
        if (lives <= 0) {
          endGame(false);
          return;
        }
        break;
      }
    }
  }

  // pizza spawn
  if (distance >= PIZZA_DISTANCE - 300 && pizzaX === null) {
    pizzaX = canvas.width + 60;
  }
  if (pizzaX !== null) {
    pizzaX -= speed;
    // catch pizza
    const pr = playerRect();
    const pizzaHit = { x: pizzaX - 32, y: GROUND_Y - 70 - 64, w: 64, h: 64 };
    if (rectsOverlap(pr, pizzaHit)) {
      endGame(true);
      return;
    }
    if (pizzaX < -80) {
      // pizza escaped — lose a life and reset
      lives--;
      livesEl.textContent = lives;
      if (lives <= 0) { endGame(false); return; }
      pizzaX = canvas.width + 60;
      distance = PIZZA_DISTANCE - 400;
    }
  }

  scoreEl.textContent = score;
  distEl.textContent = Math.floor(distance) + 'm';
}

// ── Draw ──────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  drawDistanceBar();
  drawObstacles();
  drawPizza();
  drawPlayer();
}

// ── Loop ──────────────────────────────────────────────────────
function loop() {
  update();
  if (!gameRunning) return;   // ← עוצר מיד אם endGame נקרא
  draw();
  animId = requestAnimationFrame(loop);
}

// ── Start / End ───────────────────────────────────────────────
function startGame() {
  score = 0; lives = 3; distance = 0; speed = 5; frameCount = 0;
  obstacles = []; obstacleTimer = 0; obstacleInterval = 90;
  pizzaX = null;
  player.y = GROUND_Y; player.vy = 0; player.jumping = false;
  player.jumpCount = 0; player.ducking = false; player.invincible = 0;
  livesEl.textContent = lives; scoreEl.textContent = score; distEl.textContent = '0m';

  overlay.style.display = 'none';
  gameRunning = true;
  cancelAnimationFrame(animId);
  loop();
}

function endGame(win) {
  gameRunning = false;
  cancelAnimationFrame(animId);
  // final draw
  draw();

  // Build overlay content
  overlay.innerHTML = '';

  const h2 = document.createElement('h2');
  h2.textContent = win ? '🎉 תפסת את הפיצה!' : '💀 נכשלת!';
  overlay.appendChild(h2);

  const msg = document.createElement('p');
  msg.innerHTML = win
    ? `כל הכבוד! הגעת לפיצה עם ניקוד של <strong style="color:#ffcc00">${score.toLocaleString()}</strong> נקודות!`
    : `האוכל עצר אותך... ניקוד: <strong style="color:#ffcc00">${score.toLocaleString()}</strong>`;
  overlay.appendChild(msg);

  // Leaderboard container
  const lbDiv = document.createElement('div');
  lbDiv.id = 'leaderboard';
  overlay.appendChild(lbDiv);

  const qualified = isTopTen(score);

  if (qualified) {
    const area = document.createElement('div');
    area.id = 'nameInputArea';
    area.innerHTML = `<p>🏆 נכנסת לטבלת השיאים!</p>
      <input id="nameInput" type="text" maxlength="16" placeholder="מה שמך?" />
      <button id="submitName">✔ שמור</button>`;
    overlay.appendChild(area);
    setTimeout(() => { const ni = document.getElementById('nameInput'); if (ni) ni.focus(); }, 150);

    const doSubmit = () => {
      const ni = document.getElementById('nameInput');
      const name = (ni ? ni.value.trim() : '') || 'אנונימי';
      addToLeaderboard(name, score);
      document.getElementById('nameInputArea').remove();
      renderLeaderboard(lbDiv, score);
      refreshSideLeaderboard(score);
    };

    document.getElementById('submitName').onclick = doSubmit;
    setTimeout(() => {
      const ni = document.getElementById('nameInput');
      if (ni) ni.onkeydown = e => { if (e.key === 'Enter') doSubmit(); };
    }, 160);
  } else {
    renderLeaderboard(lbDiv, score);
    refreshSideLeaderboard(score);
  }

  const btn = document.createElement('button');
  btn.id = 'startBtn';
  btn.textContent = win ? '🔄 שחק שוב' : '🔄 נסה שוב';
  btn.addEventListener('click', startGame);
  overlay.appendChild(btn);

  overlay.style.display = 'flex';
}

startBtn.addEventListener('click', startGame);

// initial draw + refresh side leaderboard
draw();
refreshSideLeaderboard(null);

// Also show leaderboard in start overlay if scores exist
(function showStartLeaderboard() {
  const lb = getLeaderboard();
  if (lb.length === 0) return;
  const lbDiv = document.createElement('div');
  lbDiv.id = 'leaderboard';
  overlay.insertBefore(lbDiv, startBtn);
  renderLeaderboard(lbDiv, null);
})();
</script>
</body>
