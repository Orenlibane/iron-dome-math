<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👾 אנציקלופדיה החלל</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  background:#000010; color:#fff;
  font-family:'Segoe UI', Arial, sans-serif;
  min-height:100vh; overflow-x:hidden;
}

/* ── Stars ── */
#stars { position:fixed; inset:0; pointer-events:none; z-index:0; }

/* ── Layout ── */
.page { position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:30px 20px 60px; }

/* ── Header ── */
header { text-align:center; margin-bottom:40px; }
header h1 {
  font-size:clamp(32px,6vw,60px); color:#00cfff;
  text-shadow:0 0 30px #00cfff, 0 0 60px rgba(0,180,255,.4);
  margin-bottom:8px; letter-spacing:2px;
}
header p { color:#aaa; font-size:16px; }
.back-btn {
  display:inline-block; margin-top:14px; padding:9px 24px;
  background:rgba(0,100,200,.25); border:1px solid rgba(0,180,255,.5);
  color:#00cfff; border-radius:20px; text-decoration:none; font-size:14px;
  transition:background .2s;
}
.back-btn:hover { background:rgba(0,100,200,.45); }

/* ── Section ── */
.section { margin-bottom:50px; }
.section-title {
  font-size:clamp(22px,4vw,34px); margin-bottom:22px;
  padding-bottom:10px; border-bottom:2px solid rgba(255,255,255,.1);
  display:flex; align-items:center; gap:12px;
}
.section-title span { color:#ffdd00; }

/* ── Cards grid ── */
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:24px; }

/* ── Card ── */
.card {
  background:rgba(0,10,35,.8); border-radius:18px;
  border:1px solid rgba(100,180,255,.2);
  box-shadow:0 4px 30px rgba(0,0,0,.5);
  overflow:hidden; transition:transform .2s, box-shadow .2s;
  position:relative;
}
.card:hover {
  transform:translateY(-4px);
  box-shadow:0 8px 40px rgba(0,150,255,.25);
}
.card.boss {
  border-color:rgba(255,100,0,.4);
  box-shadow:0 4px 30px rgba(255,80,0,.15);
}
.card.boss:hover {
  box-shadow:0 8px 40px rgba(255,100,0,.35);
}
.card-glow {
  position:absolute; inset:0; pointer-events:none; border-radius:18px;
  opacity:0; transition:opacity .3s;
}
.card:hover .card-glow { opacity:1; }

.card-canvas-wrap {
  display:flex; justify-content:center; align-items:center;
  height:160px; background:rgba(0,0,20,.6);
  border-bottom:1px solid rgba(255,255,255,.06); padding:10px;
  position:relative; overflow:hidden;
}
.card-canvas-wrap::before {
  content:''; position:absolute; inset:0;
  background:radial-gradient(circle at 50% 60%, var(--glow,rgba(0,150,255,.08)), transparent 70%);
}
canvas.alien-sprite { display:block; }

.card-body { padding:18px 20px 20px; }
.card-names { margin-bottom:10px; }
.card-name-he {
  font-size:22px; font-weight:bold; color:#fff;
  text-shadow:0 0 10px var(--col,#00cfff);
}
.card-name-en { font-size:12px; color:#888; margin-top:2px; letter-spacing:1px; }
.card-badge {
  display:inline-block; padding:2px 10px; border-radius:10px;
  font-size:11px; font-weight:bold; margin-bottom:10px;
  background:rgba(255,255,255,.08); color:#ccc; border:1px solid rgba(255,255,255,.12);
}
.card-badge.boss-badge {
  background:rgba(255,100,0,.15); color:#ffaa44; border-color:rgba(255,120,0,.35);
}

.card-desc { font-size:13px; color:#bbb; line-height:1.7; margin-bottom:12px; }

.stats { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; margin-bottom:12px; }
.stat { display:flex; justify-content:space-between; align-items:center; }
.stat-label { font-size:11px; color:#777; }
.stat-val { font-size:13px; font-weight:bold; color:#fff; }

.ability-row {
  display:flex; align-items:center; gap:8px; padding:6px 10px;
  background:rgba(255,200,0,.06); border:1px solid rgba(255,200,0,.15);
  border-radius:8px; margin-bottom:10px; font-size:12px;
}
.ability-icon { font-size:16px; }
.ability-name { color:#ffdd00; font-weight:bold; }

.tip {
  font-size:12px; color:#aaa; padding:8px 12px;
  background:rgba(0,255,100,.05); border-right:3px solid rgba(0,255,100,.4);
  border-radius:0 8px 8px 0; line-height:1.6;
}
.tip strong { color:#00ff88; }

/* Danger stars */
.danger { display:flex; gap:3px; align-items:center; margin-bottom:8px; }
.star { font-size:14px; filter:grayscale(1) opacity(.3); }
.star.on { filter:none; }

/* Level badge */
.level-pill {
  position:absolute; top:12px; left:12px;
  background:rgba(0,0,0,.7); border:1px solid rgba(255,200,0,.4);
  color:#ffdd00; font-size:11px; font-weight:bold;
  padding:3px 10px; border-radius:10px;
}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="page">
  <header>
    <div style="font-size:52px;margin-bottom:4px">👾</div>
    <h1>אנציקלופדיה החלל</h1>
    <p>מידע מסווג על האויבים בגלקסיה — פרטים, כוחות ואיך להביס אותם</p>
    <a href="rocket-space.html" class="back-btn">🚀 חזרה למשחק</a>
    &nbsp;
    <a href="index.html" class="back-btn" style="border-color:rgba(180,150,255,.5);color:#bb99ff">🏠 דף הבית</a>

  <!-- ── Aliens ── -->
  <section class="section">
    <div class="section-title">🛸 <span>חייזרים</span> — יחידות רגילות</div>
    <div class="cards" id="alienCards"></div>
  </section>

  <section class="section">
    <div class="section-title">💀 <span>בוסים</span> — ראשי גוש</div>

</div>

<script>
// ══════════════════════════════════════════════
//  STARS BACKGROUND
// ══════════════════════════════════════════════
const starCanvas = document.getElementById('stars');
const sctx = starCanvas.getContext('2d');
let stars = [];
function resizeStars(){
  starCanvas.width = window.innerWidth;
  starCanvas.height = window.innerHeight;
  stars = Array.from({length:220},()=>({
    x:Math.random()*starCanvas.width, y:Math.random()*starCanvas.height,
    r:Math.random()*1.8+.2, op:.1+Math.random()*.7, tw:Math.random()*Math.PI*2
  }));
}
window.addEventListener('resize', resizeStars); resizeStars();
function animStars(){
  sctx.clearRect(0,0,starCanvas.width,starCanvas.height);
  stars.forEach(s=>{
    s.tw+=.006;
    sctx.globalAlpha=s.op*(.6+.4*Math.sin(s.tw));
    sctx.fillStyle='#fff';
    sctx.beginPath(); sctx.arc(s.x,s.y,s.r,0,Math.PI*2); sctx.fill();
  }); sctx.globalAlpha=1;
  requestAnimationFrame(animStars);
}
animStars();

// ══════════════════════════════════════════════
//  DRAWING HELPERS (same as game)
// ══════════════════════════════════════════════
function lighten(hex, amt){
  const n=parseInt(hex.slice(1),16);
  return `rgb(${Math.min(255,(n>>16)+amt)},${Math.min(255,((n>>8)&0xff)+amt)},${Math.min(255,(n&0xff)+amt)})`;
}

// ══════════════════════════════════════════════
//  DATA
// ══════════════════════════════════════════════
const ALIENS = [
  {
    id:'zrix', name:'זריקס', nameEn:'Zrix Scout', color:'#ff44aa', dark:'#aa0066',
    hp:1, speed:'מהיר', pts:'10–60', danger:2, level:'שלב 1+',
    ability:'⚡ מהירות גבוהה',

    tip:'קל להפיל — פגיעה אחת מספיקה. נקה אותם מהר לפני שמצטברים.',
  },
  {

    ability:'🔫 ירי מהיר לכיוונך',
    desc:'חייל מנוסה של הכוחות הזרים. עמיד יותר ויורה תדיר לכיוון הרקטה שלך.',
    tip:'תירה ישר כשהוא בא מלמעלה. היזהר מהקליעים שלו.',

    ability:'🛡️ שריון כפול',

    tip:'צריך לפחות 3 פגיעות. שדרג נשק לרמה 2+ לפני שאתה תוקף.',

const BOSSES = [
  {
    id:'vorex', name:'ורקס', nameEn:'Commander Vorex', color:'#ff2200', dark:'#880000',
    hp:'20–40', speed:'בינוני', pts:'500+', danger:5, level:'שלב 5',
    ability:'💥 ירי מניפה ×5',
    desc:'מפקד בכיר של הגלקסיה השלישית. מגיע בצלחת ענקית עם 4 זרועות תותח מסתובבות. יורה בפרץ מאוורר.',
    tip:'הצמד לצדדים — הירי המרכזי שלו הכי מסוכן. פגע בו מהצד.',
  },
  {

    hp:'35–70', speed:'איטי', pts:'900+', danger:5, level:'שלב 10',
    ability:'👾 מזמן מיניונים',
    desc:'מלכת הכוורת הסגולה. עין ענקית אחת, צמחים עצביים, וטנטקלים. שולחת מיניונים כל כמה שניות.',
    tip:'התעלם מהמיניונים — תתמקד בה ישירות. ממש בתחתיתה הנקודה החלשה.',

    ability:'🔵 מגן + לייזרים',

    tip:'כשה-HP שלו יורד מתחת ל-50% המגן נכבה — תירה בכל הכוח בדיוק אז!',

// ══════════════════════════════════════════════
//  ALIEN SPRITE DRAWING
// ══════════════════════════════════════════════
function drawAlienSprite(ctx, alienId, color, dark, cx, cy, scale){
  ctx.save(); ctx.translate(cx, cy); ctx.scale(scale, scale);
  ctx.shadowColor=color; ctx.shadowBlur=20;
  const w=44, h=36;
  // Body
  ctx.beginPath(); ctx.ellipse(0,0,w/2,h/2*.7,0,0,Math.PI*2);
  const bg=ctx.createRadialGradient(-5,-5,2,0,0,w/2);
  bg.addColorStop(0,lighten(color,80)); bg.addColorStop(1,color);
  ctx.fillStyle=bg; ctx.fill();
  // Eyes
  const eyeXs = alienId==='kraven'?[-14,0,14]:[-10,10];
  eyeXs.forEach(ex=>{
    ctx.beginPath(); ctx.ellipse(ex,-4,6,7,0,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex+1,-3,3.5,0,Math.PI*2); ctx.fillStyle=alienId==='zrix'?'#ff0044':'#111'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex-1,-5,1.2,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  });
  // Tentacles
  const tentCount = alienId==='zrix'?3:alienId==='gloob'?5:6;
  const t = Date.now()/300;
  for(let i=0;i<tentCount;i++){
    const tx=-(tentCount-1)*5+i*10, wig=Math.sin(t*2+i)*5;
    ctx.beginPath(); ctx.moveTo(tx,8); ctx.quadraticCurveTo(tx+wig,20,tx+wig*1.5,28);
    ctx.strokeStyle=color; ctx.lineWidth=3; ctx.lineCap='round'; ctx.stroke();
  }
  // Antenna(s)
  const antennas = alienId==='kraven'?[[-8,-14],[8,-14]]:[[-8,-14]];
  antennas.forEach(([ax,ay])=>{
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(ax-6,ay-12,ax-2,ay-18);
    ctx.strokeStyle=lighten(color,50); ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.arc(ax-2,ay-20,3.5,0,Math.PI*2); ctx.fillStyle=lighten(color,80); ctx.fill();
  });
  ctx.restore();
}

// ══════════════════════════════════════════════
//  BOSS SPRITE DRAWING
// ══════════════════════════════════════════════
function drawBossSprite(ctx, bossId, color, dark, cx, cy, scale){
  ctx.save(); ctx.translate(cx, cy); ctx.scale(scale, scale);
  ctx.shadowColor=color; ctx.shadowBlur=25;

  if(bossId==='vorex'){
    const g=ctx.createRadialGradient(-10,-10,5,0,0,55);
    g.addColorStop(0,'#ff6633'); g.addColorStop(1,'#880000');
    ctx.beginPath(); ctx.ellipse(0,0,55,33,0,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle='#ff4400'; ctx.lineWidth=2.5; ctx.stroke();
    const dg=ctx.createRadialGradient(-8,-8,3,0,0,22);
    dg.addColorStop(0,'#ffaa88'); dg.addColorStop(1,'#cc2200');
    ctx.beginPath(); ctx.ellipse(0,-8,22,16,0,Math.PI,0); ctx.fillStyle=dg; ctx.fill();
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2+Date.now()/2000;
      ctx.save(); ctx.rotate(a);
      ctx.fillStyle='#cc3300'; ctx.fillRect(30,-4,20,8); ctx.fillRect(46,-3,7,6);
      ctx.restore();
    }
    [-14,14].forEach(ex=>{
      ctx.beginPath(); ctx.ellipse(ex,-4,8,10,0,0,Math.PI*2); ctx.fillStyle='#ffeecc'; ctx.fill();
      ctx.beginPath(); ctx.arc(ex,-3,6,0,Math.PI*2); ctx.fillStyle='#ff0000'; ctx.fill();
      ctx.beginPath(); ctx.arc(ex-2,-6,2,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    });

  } else if(bossId==='nexis'){
    const g=ctx.createRadialGradient(-12,-12,8,0,0,50);
    g.addColorStop(0,'#dd88ff'); g.addColorStop(1,'#6600aa');
    ctx.beginPath(); ctx.ellipse(0,5,50,40,0,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle='#aa44ff'; ctx.lineWidth=2.5; ctx.stroke();
    for(let i=0;i<7;i++){
      const a=-Math.PI+(i/6)*Math.PI;
      const r1=50, r2=r1+18+Math.sin(Date.now()/400+i)*4;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1-5);
      ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2-5);
      ctx.strokeStyle=lighten(color,60); ctx.lineWidth=4; ctx.lineCap='round'; ctx.stroke();
      ctx.beginPath(); ctx.arc(Math.cos(a)*r2,Math.sin(a)*r2-5,4,0,Math.PI*2);
      ctx.fillStyle='#dd88ff'; ctx.fill();
    }
    ctx.beginPath(); ctx.ellipse(0,-5,20,24,0,0,Math.PI*2); ctx.fillStyle='#220033'; ctx.fill();
    ctx.strokeStyle='#dd88ff'; ctx.lineWidth=1.5; ctx.stroke();
    const px=Math.cos(Date.now()/700)*7, py=Math.sin(Date.now()/700)*7-5;
    ctx.beginPath(); ctx.arc(px,py,12,0,Math.PI*2); ctx.fillStyle='#aa00ff'; ctx.fill();
    ctx.beginPath(); ctx.arc(px,py,5,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    const t2=Date.now()/250;
    for(let i=0;i<5;i++){
      const tx=-20+i*10;
      ctx.beginPath(); ctx.moveTo(tx,40);
      ctx.quadraticCurveTo(tx+Math.sin(t2+i)*12,56,tx+Math.sin(t2+i)*18,72);
      ctx.strokeStyle=color; ctx.lineWidth=5; ctx.lineCap='round'; ctx.stroke();
    }

  } else if(bossId==='omega'){
    const g=ctx.createLinearGradient(-60,-55,60,55);
    g.addColorStop(0,'#001122'); g.addColorStop(.5,'#003355'); g.addColorStop(1,'#000811');
    ctx.beginPath();
    ctx.moveTo(0,-55); ctx.lineTo(60,-27); ctx.lineTo(60,27);
    ctx.lineTo(0,55); ctx.lineTo(-60,27); ctx.lineTo(-60,-27);
    ctx.closePath(); ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle=`rgba(0,200,255,${.5+.5*Math.sin(Date.now()/200)})`; ctx.lineWidth=2.5; ctx.stroke();
    const cg=ctx.createRadialGradient(0,0,5,0,0,24);
    cg.addColorStop(0,'#ffffff'); cg.addColorStop(.3,'#00eeff'); cg.addColorStop(1,'rgba(0,100,200,0)');
    ctx.beginPath(); ctx.arc(0,0,24,0,Math.PI*2); ctx.fillStyle=cg; ctx.fill();
    [[-50,0],[50,0],[0,-46]].forEach(([px,py])=>{
      ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2);
      ctx.fillStyle=`rgba(0,220,255,${.6+.4*Math.sin(Date.now()/150)})`; ctx.fill();
    });
    const sa=(Date.now()/1000)%Math.PI;
    for(let i=0;i<8;i++){
      const a=sa+i*Math.PI/4;
      ctx.beginPath(); ctx.arc(Math.cos(a)*52,Math.sin(a)*52,6,0,Math.PI*2);
      ctx.fillStyle='rgba(0,200,255,.4)'; ctx.fill();
    }
  }
  ctx.restore();
}

// ══════════════════════════════════════════════
//  CARD BUILDER
// ══════════════════════════════════════════════
function dangerStars(n){
  return Array.from({length:5},(_,i)=>`<span class="star ${i<n?'on':''}">★</span>`).join('');
}

function buildAlienCard(data){
  const card = document.createElement('div');
  card.className='card';
  card.style.setProperty('--col', data.color);
  card.style.setProperty('--glow', `rgba(${hexToRgb(data.color)},.12)`);

  // Canvas sprite
  const wrap = document.createElement('div');
  wrap.className='card-canvas-wrap';
  const cv = document.createElement('canvas');
  cv.width=200; cv.height=140; cv.className='alien-sprite';
  wrap.appendChild(cv);

  const glow = document.createElement('div');
  glow.className='card-glow';
  glow.style.background=`radial-gradient(circle at 50% 60%, ${data.color}22, transparent 65%)`;
  card.appendChild(glow);
  card.appendChild(wrap);

  const body = document.createElement('div');
  body.className='card-body';
  body.innerHTML=`
    <div class="card-names">
      <div class="card-name-he" style="color:${data.color}">${data.name}</div>
      <div class="card-name-en">${data.nameEn}</div>
    </div>
    <span class="card-badge">${data.level}</span>
    <div class="danger">${dangerStars(data.danger)}</div>
    <div class="card-desc">${data.desc}</div>
    <div class="stats">
      <div class="stat"><span class="stat-label">❤️ HP</span><span class="stat-val">${data.hp}</span></div>
      <div class="stat"><span class="stat-label">🏎️ מהירות</span><span class="stat-val">${data.speed}</span></div>
      <div class="stat"><span class="stat-label">⭐ נקודות</span><span class="stat-val">${data.pts}</span></div>
    </div>
    <div class="ability-row">
      <span class="ability-icon">⚡</span>
      <span class="ability-name">${data.ability}</span>
    </div>
    <div class="tip"><strong>💡 טיפ:</strong> ${data.tip}</div>
  `;
  card.appendChild(body);

  // Animate sprite
  (function loop(){
    const c=cv.getContext('2d'); c.clearRect(0,0,200,140);
    drawAlienSprite(c, data.id, data.color, data.dark, 100, 70, 1.5);
    requestAnimationFrame(loop);
  })();

  return card;
}

function buildBossCard(data){
  const card = document.createElement('div');
  card.className='card boss';
  card.style.setProperty('--col', data.color);

  const levelPill = document.createElement('div');
  levelPill.className='level-pill';
  levelPill.textContent=data.level;
  card.appendChild(levelPill);

  const wrap = document.createElement('div');
  wrap.className='card-canvas-wrap';
  wrap.style.height='180px';
  const cv = document.createElement('canvas');
  cv.width=220; cv.height=170; cv.className='alien-sprite';
  wrap.appendChild(cv);

  const glow = document.createElement('div');
  glow.className='card-glow';
  glow.style.background=`radial-gradient(circle at 50% 60%, ${data.color}22, transparent 65%)`;
  card.appendChild(glow);
  card.appendChild(wrap);

  const body = document.createElement('div');
  body.className='card-body';
  body.innerHTML=`
    <div class="card-names">
      <div class="card-name-he" style="color:${data.color};font-size:26px">${data.name}</div>
      <div class="card-name-en">${data.nameEn}</div>
    </div>
    <span class="card-badge boss-badge">⚠️ בוס</span>
    <div class="danger">${dangerStars(data.danger)}</div>
    <div class="card-desc">${data.desc}</div>
    <div class="stats">
      <div class="stat"><span class="stat-label">❤️ HP</span><span class="stat-val">${data.hp}</span></div>
      <div class="stat"><span class="stat-label">🏎️ מהירות</span><span class="stat-val">${data.speed}</span></div>
      <div class="stat"><span class="stat-label">⭐ נקודות</span><span class="stat-val">${data.pts}</span></div>
    </div>
    <div class="ability-row">
      <span class="ability-icon">💀</span>
      <span class="ability-name">${data.ability}</span>
    </div>
    <div class="tip"><strong>💡 טיפ:</strong> ${data.tip}</div>
  `;
  card.appendChild(body);

  (function loop(){
    const c=cv.getContext('2d'); c.clearRect(0,0,220,170);
    drawBossSprite(c, data.id, data.color, data.dark, 110, 80, 0.85);
    requestAnimationFrame(loop);
  })();

  return card;
}

function hexToRgb(hex){
  const n=parseInt(hex.slice(1),16);
  return `${n>>16},${(n>>8)&255},${n&255}`;
}

const alienContainer = document.getElementById('alienCards');
const bossContainer  = document.getElementById('bossCards');

ALIENS.forEach(a => alienContainer.appendChild(buildAlienCard(a)));
BOSSES.forEach(b => bossContainer.appendChild(buildBossCard(b)));
</script>
