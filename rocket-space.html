<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 רקטה בחלל</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        #gameContainer { position: relative; }
        canvas {
            display: block;
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.2);
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,20,0.88);
            z-index: 20;
            border-radius: 8px;
        }
        #overlay h1 {
            font-size: 44px;
            color: #00cfff;
            text-shadow: 0 0 20px #00cfff;
            margin-bottom: 8px;
            direction: rtl;
        }
        #overlay p {
            color: #aaa;
            font-size: 15px;
            margin: 4px 0;
            direction: rtl;
        }
        .btn {
            margin-top: 24px;
            padding: 13px 38px;
            font-size: 19px;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-blue {
            background: linear-gradient(135deg, #00cfff, #0060ff);
            box-shadow: 0 0 20px rgba(0,200,255,0.5);
        }
        .btn-red {
            background: linear-gradient(135deg, #ff4488, #aa0066);
            box-shadow: 0 0 20px rgba(255,68,136,0.5);
        }
        .btn:hover { transform: scale(1.05); }
        #controlToggle {
            position: absolute;
            bottom: 15px; right: 20px;
            padding: 8px 16px;
            background: rgba(0,150,255,0.2);
            border: 1px solid rgba(0,150,255,0.5);
            color: #fff;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            z-index: 15;
        }
        #controlToggle:hover { background: rgba(0,150,255,0.4); }

        /* Leaderboard */
        #leaderboard {
            margin-top: 18px;
            width: 320px;
            background: rgba(0,10,40,0.8);
            border: 1px solid rgba(0,200,255,0.3);
            border-radius: 12px;
            padding: 12px 18px;
            direction: rtl;
            max-height: 230px;
            overflow-y: auto;
        }
        #leaderboard h3 {
            color: #ffdd00;
            font-size: 16px;
            margin-bottom: 8px;
            text-align: center;
        }
        .lb-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            color: #ccc;
            font-size: 14px;
        }
        .lb-row.highlight { color: #ffdd00; font-weight: bold; }
        .lb-rank { width: 28px; color: #888; }
        .lb-name { flex: 1; }
        .lb-score { color: #00cfff; }

        /* Name input */
        #nameInputArea {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            direction: rtl;
        }
        #nameInputArea p { color: #ffdd00; font-size: 16px; font-weight: bold; }
        #nameInput {
            padding: 10px 16px;
            font-size: 16px;
            border-radius: 20px;
            border: 2px solid #00cfff;
            background: rgba(0,10,40,0.9);
            color: #fff;
            text-align: center;
            width: 220px;
            outline: none;
        }
        #submitName {
            padding: 10px 28px;
            font-size: 15px;
            background: linear-gradient(135deg,#00cfff,#0060ff);
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        #submitName:hover { opacity: 0.85; }
    </style>
</head>
<body>
<a href="index.html" style="position:fixed;top:16px;right:16px;padding:8px 20px;font-size:.9rem;background:rgba(0,150,255,.2);border:1px solid rgba(0,150,255,.5);color:#0af;border-radius:20px;cursor:pointer;z-index:999;text-decoration:none;">🏠 חזרה לתפריט</a>
<div id="gameContainer">
    <canvas id="gameCanvas" width="500" height="700"></canvas>

    <div id="overlay">
        <h1>🚀 רקטה בחלל</h1>
        <p>השמד את החייזרים לפני שהם ישמידו אותך!</p>
        <p style="margin-top:14px; color:#666;">← → להזזה | רווח לירות</p>
        <p style="color:#666;">אסוף פריטים לחיים נוספים, נשק חזק ומגן!</p>
        <button class="btn btn-blue" id="startBtn">🚀 התחל!</button>
        <a href="encyclopedia.html" class="btn" style="background:linear-gradient(135deg,#6644cc,#220088);box-shadow:0 0 20px rgba(100,60,200,.4);margin-top:0;text-decoration:none">👾 אנציקלופדיה</a>
        <div id="leaderboard" style="display:none;"></div>
    </div>

    <button id="controlToggle">🖱️ עבור לעכבר</button>
</div>

<script>
// ── Canvas setup ──────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const overlay       = document.getElementById('overlay');
const controlToggle = document.getElementById('controlToggle');
const W = canvas.width, H = canvas.height;

// ── Leaderboard (localStorage) ────────────────────────────
const LB_KEY = 'rocketSpaceLeaderboard';

function getLeaderboard() {
    try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch { return []; }
}
function saveLeaderboard(lb) {
    localStorage.setItem(LB_KEY, JSON.stringify(lb));
}
function isTopTen(score) {
    const lb = getLeaderboard();
    return lb.length < 10 || score > lb[lb.length - 1].score;
}
function addScore(name, score, level) {
    const lb = getLeaderboard();
    lb.push({ name, score, level });
    lb.sort((a, b) => b.score - a.score);
    const trimmed = lb.slice(0, 10);
    saveLeaderboard(trimmed);
    return trimmed;
}
function renderLeaderboard(highlightScore) {
    const lb = getLeaderboard();
    const el = document.getElementById('leaderboard');
    if (lb.length === 0) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    const medals = ['🥇','🥈','🥉'];
    el.innerHTML = '<h3>🏆 שיאים</h3>' + lb.map((e, i) => {
        const hi = e.score === highlightScore ? 'highlight' : '';
        const rank = medals[i] || `${i+1}.`;
        return `<div class="lb-row ${hi}">
            <span class="lb-rank">${rank}</span>
            <span class="lb-name">${e.name}</span>
            <span class="lb-score">${e.score.toLocaleString()}</span>
        </div>`;
    }).join('');
}

// ── Game state ────────────────────────────────────────────
let gameRunning = false, useMouseControl = false;
let score, level, lives, shieldActive, shieldTimer;
let weaponLevel, weaponTimer, invincible, invincibleTimer, gameOver;

// Stars
const stars = Array.from({length:160}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    size: Math.random()*2, speed: 0.3+Math.random()*1.5, opacity: 0.3+Math.random()*0.7
}));

let player, bullets, enemyBullets, enemies, particles, powerups;
let keys = {}, mouseX = W/2;
let shootCooldown, spaceHeld, mouseHeld;
let spawnTimer, spawnRate, enemyShootTimer;

function init() {
    score=0; level=1; lives=3;
    shieldActive=false; shieldTimer=0;
    weaponLevel=1; weaponTimer=0;
    invincible=false; invincibleTimer=0; gameOver=false;
    bullets=[]; enemyBullets=[]; enemies=[]; particles=[]; powerups=[];
    player={x:W/2, y:H-100, w:40, h:56, speed:5};
    shootCooldown=0; spaceHeld=false; mouseHeld=false;
    spawnTimer=0; spawnRate=120; enemyShootTimer=0;
    // Reset boss state on every new game
    bossActive=false; bossSpawned={};
}

// ── Helpers ───────────────────────────────────────────────
function lighten(hex, amt) {
    const n=parseInt(hex.slice(1),16);
    const r=Math.min(255,(n>>16)+amt), g=Math.min(255,((n>>8)&0xff)+amt), b=Math.min(255,(n&0xff)+amt);
    return `rgb(${r},${g},${b})`;
}
function createParticles(x,y,color,count=12){
    for(let i=0;i<count;i++){
        const a=(Math.PI*2*i/count)+Math.random()*.5, sp=2+Math.random()*4;
        particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.02+Math.random()*.03,size:2+Math.random()*4,color});
    }
}

// ── Draw: Rocket ──────────────────────────────────────────
function drawRocket(x,y) {
    ctx.save(); ctx.translate(x,y);
    if(shieldActive){
        const p=.8+.2*Math.sin(Date.now()/150);
        ctx.beginPath(); ctx.arc(0,0,38*p,0,Math.PI*2);
        ctx.strokeStyle=`rgba(0,200,255,${.6*p})`; ctx.lineWidth=3; ctx.stroke();
        ctx.fillStyle='rgba(0,100,255,.1)'; ctx.fill();
    }
    if(invincible && Math.floor(Date.now()/80)%2===0){ctx.restore();return;}
    // Flame
    const fH=18+Math.random()*10;
    const fg=ctx.createLinearGradient(0,20,0,20+fH);
    fg.addColorStop(0,'#ff6600'); fg.addColorStop(.5,'#ff2200'); fg.addColorStop(1,'rgba(255,0,0,0)');
    ctx.beginPath(); ctx.moveTo(-10,20); ctx.lineTo(0,20+fH); ctx.lineTo(10,20); ctx.fillStyle=fg; ctx.fill();
    // Side flames
    const sf=10+Math.random()*6, sg=ctx.createLinearGradient(0,18,0,18+sf);
    sg.addColorStop(0,'#ff8800'); sg.addColorStop(1,'rgba(255,140,0,0)');
    [-1,1].forEach(s=>{
        ctx.beginPath(); ctx.moveTo(s*16,18); ctx.lineTo(s*22,18+sf); ctx.lineTo(s*10,18);
        ctx.fillStyle=sg; ctx.fill();
    });
    // Body
    const bg=ctx.createLinearGradient(-20,-25,20,25);
    bg.addColorStop(0,'#4488ff'); bg.addColorStop(.5,'#99ccff'); bg.addColorStop(1,'#2255cc');
    ctx.beginPath(); ctx.moveTo(0,-28);
    ctx.bezierCurveTo(14,-10,20,10,16,25); ctx.lineTo(-16,25);
    ctx.bezierCurveTo(-20,10,-14,-10,0,-28);
    ctx.fillStyle=bg; ctx.fill(); ctx.strokeStyle='rgba(150,200,255,.5)'; ctx.lineWidth=1; ctx.stroke();
    // Wings
    [[-16,15,-32,28,-18,22],[16,15,32,28,18,22]].forEach(([x1,y1,x2,y2,x3,y3])=>{
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3);
        ctx.fillStyle='#1144aa'; ctx.fill();
    });
    // Window
    ctx.beginPath(); ctx.arc(0,-8,9,0,Math.PI*2);
    const wg=ctx.createRadialGradient(-3,-11,1,0,-8,9);
    wg.addColorStop(0,'#aaddff'); wg.addColorStop(1,'#0033aa');
    ctx.fillStyle=wg; ctx.fill(); ctx.strokeStyle='rgba(200,230,255,.8)'; ctx.lineWidth=1.5; ctx.stroke();
    // Weapon dots
    if(weaponLevel>1){
        ctx.fillStyle=weaponLevel>=3?'#ff4400':'#ffaa00';
        [[-8,-25],[8,-25]].forEach(([px,py])=>{ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();});
    }
    ctx.restore();
}

// ── Draw: Alien ───────────────────────────────────────────
function drawAlien(e) {
    if(e.isBoss){ drawBoss(e); return; }
    ctx.save(); ctx.translate(e.x, e.y);
    const bob=Math.sin(Date.now()/400+e.phase)*3; ctx.translate(0,bob);
    ctx.shadowColor=e.color; ctx.shadowBlur=15;
    // Body
    ctx.beginPath(); ctx.ellipse(0,0,e.w/2,e.h/2*.7,0,0,Math.PI*2);
    const bg=ctx.createRadialGradient(-5,-5,2,0,0,e.w/2);
    bg.addColorStop(0,lighten(e.color,80)); bg.addColorStop(1,e.color);
    ctx.fillStyle=bg; ctx.fill();
    // Eyes (shape varies by type)
    const eyeCount = e.alienId==='kraven' ? 3 : 2;
    const eyeXs = eyeCount===3 ? [-14,0,14] : [-10,10];
    eyeXs.forEach(ex=>{
        ctx.beginPath(); ctx.ellipse(ex,-4,6,7,0,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
        ctx.beginPath(); ctx.arc(ex+1,-3,3.5,0,Math.PI*2); ctx.fillStyle=e.alienId==='zrix'?'#ff0044':'#111'; ctx.fill();
        ctx.beginPath(); ctx.arc(ex-1,-5,1.2,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    });
    // Tentacles
    const t=Date.now()/300;
    const tentCount = e.alienId==='zrix'?3:e.alienId==='gloob'?5:6;
    for(let i=0;i<tentCount;i++){
        const tx=-(tentCount-1)*5+i*10, wig=Math.sin(t*2+i)*5;
        ctx.beginPath(); ctx.moveTo(tx,8); ctx.quadraticCurveTo(tx+wig,20,tx+wig*1.5,28);
        ctx.strokeStyle=e.color; ctx.lineWidth=3; ctx.lineCap='round'; ctx.stroke();
    }
    // Antenna(s)
    const antennas = e.alienId==='kraven'?[[-8,-14],[ 8,-14]]:[[-8,-14]];
    antennas.forEach(([ax,ay])=>{
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.quadraticCurveTo(ax-6,ay-12,ax-2,ay-18);
        ctx.strokeStyle=lighten(e.color,50); ctx.lineWidth=2; ctx.stroke();
        ctx.beginPath(); ctx.arc(ax-2,ay-20,3.5,0,Math.PI*2); ctx.fillStyle=lighten(e.color,80); ctx.fill();
    });
    // HP bar
    if(e.maxHealth>1){
        const bw=e.w, rat=e.health/e.maxHealth;
        ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(-bw/2,-e.h/2-14,bw,5);
        ctx.fillStyle=rat>.5?'#00ff88':rat>.25?'#ffaa00':'#ff2200';
        ctx.fillRect(-bw/2,-e.h/2-14,bw*rat,5);
    }
    ctx.restore();
}

// ── Draw: Boss ────────────────────────────────────────────
function drawBoss(e) {
    const bd=e.bossDef;
    ctx.save(); ctx.translate(e.x, e.y);
    const bob=Math.sin(Date.now()/600)*4; ctx.translate(0,bob);
    ctx.shadowColor=e.color; ctx.shadowBlur=30;

    if(bd.id==='vorex'){
        // Red commander – armored saucer with cannon arms
        const g=ctx.createRadialGradient(-10,-10,5,0,0,e.w/2);
        g.addColorStop(0,'#ff6633'); g.addColorStop(1,'#880000');
        ctx.beginPath(); ctx.ellipse(0,0,e.w/2,e.h/2*.6,0,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
        ctx.strokeStyle='#ff4400'; ctx.lineWidth=3; ctx.stroke();
        // Dome
        const dg=ctx.createRadialGradient(-8,-8,3,0,0,26);
        dg.addColorStop(0,'#ffaa88'); dg.addColorStop(1,'#cc2200');
        ctx.beginPath(); ctx.ellipse(0,-8,26,20,0,Math.PI,0); ctx.fillStyle=dg; ctx.fill();
        // 4 cannon arms
        for(let i=0;i<4;i++){
            const a=i*Math.PI/2+Date.now()/2000;
            ctx.save(); ctx.rotate(a);
            ctx.fillStyle='#cc3300'; ctx.fillRect(30,-4,22,8); ctx.fillRect(48,-3,8,6);
            ctx.restore();
        }
        // Eyes
        [-16,16].forEach(ex=>{
            ctx.beginPath(); ctx.ellipse(ex,-4,9,11,0,0,Math.PI*2); ctx.fillStyle='#ffeecc'; ctx.fill();
            ctx.beginPath(); ctx.arc(ex,-3,6,0,Math.PI*2); ctx.fillStyle='#ff0000'; ctx.fill();
            ctx.beginPath(); ctx.arc(ex-2,-6,2,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
        });

    } else if(bd.id==='nexis'){
        // Purple queen – large organic shape, crown of spikes
        const g=ctx.createRadialGradient(-12,-12,8,0,0,e.w/2);
        g.addColorStop(0,'#dd88ff'); g.addColorStop(1,'#6600aa');
        ctx.beginPath(); ctx.ellipse(0,5,e.w/2,e.h/2*.75,0,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
        ctx.strokeStyle='#aa44ff'; ctx.lineWidth=3; ctx.stroke();
        // Crown spikes
        for(let i=0;i<7;i++){
            const a=-Math.PI+(i/(6))*Math.PI;
            const r1=e.w/2, r2=r1+22+Math.sin(Date.now()/400+i)*5;
            ctx.beginPath(); ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1-5);
            ctx.lineTo(Math.cos(a)*(r2),Math.sin(a)*(r2)-5);
            ctx.strokeStyle=lighten(bd.color,60); ctx.lineWidth=4; ctx.lineCap='round'; ctx.stroke();
            ctx.beginPath(); ctx.arc(Math.cos(a)*r2,Math.sin(a)*r2-5,5,0,Math.PI*2);
            ctx.fillStyle='#dd88ff'; ctx.fill();
        }
        // Main eye (single huge eye)
        ctx.beginPath(); ctx.ellipse(0,-5,22,26,0,0,Math.PI*2); ctx.fillStyle='#220033'; ctx.fill();
        ctx.strokeStyle='#dd88ff'; ctx.lineWidth=2; ctx.stroke();
        const pupilX=Math.cos(Date.now()/700)*8, pupilY=Math.sin(Date.now()/700)*8-5;
        ctx.beginPath(); ctx.arc(pupilX,pupilY,13,0,Math.PI*2); ctx.fillStyle='#aa00ff'; ctx.fill();
        ctx.beginPath(); ctx.arc(pupilX,pupilY,6,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
        // Tentacles (thick)
        for(let i=0;i<6;i++){
            const tx=-25+i*10, t2=Date.now()/250;
            ctx.beginPath(); ctx.moveTo(tx,e.h/2*.6);
            ctx.quadraticCurveTo(tx+Math.sin(t2+i)*15,e.h/2*.6+28,tx+Math.sin(t2+i)*22,e.h/2*.6+50);
            ctx.strokeStyle=bd.color; ctx.lineWidth=6; ctx.lineCap='round'; ctx.stroke();
        }

    } else if(bd.id==='omega'){
        // Omega – black angular destroyer with blue energy core
        const g=ctx.createLinearGradient(-e.w/2,-e.h/2,e.w/2,e.h/2);
        g.addColorStop(0,'#001122'); g.addColorStop(.5,'#003355'); g.addColorStop(1,'#000811');
        ctx.beginPath();
        ctx.moveTo(0,-e.h/2); ctx.lineTo(e.w/2,-e.h/4);
        ctx.lineTo(e.w/2,e.h/4); ctx.lineTo(0,e.h/2);
        ctx.lineTo(-e.w/2,e.h/4); ctx.lineTo(-e.w/2,-e.h/4);
        ctx.closePath(); ctx.fillStyle=g; ctx.fill();
        ctx.strokeStyle=`rgba(0,200,255,${.5+.5*Math.sin(Date.now()/200)})`; ctx.lineWidth=3; ctx.stroke();
        // Energy core
        const cg=ctx.createRadialGradient(0,0,5,0,0,28);
        cg.addColorStop(0,'#ffffff'); cg.addColorStop(.3,'#00eeff'); cg.addColorStop(1,'rgba(0,100,200,0)');
        ctx.beginPath(); ctx.arc(0,0,28,0,Math.PI*2); ctx.fillStyle=cg; ctx.fill();
        // Laser ports
        [[-e.w/2+8,0],[e.w/2-8,0],[0,-e.h/2+8]].forEach(([px,py])=>{
            ctx.beginPath(); ctx.arc(px,py,8,0,Math.PI*2);
            ctx.fillStyle=`rgba(0,220,255,${.6+.4*Math.sin(Date.now()/150)})`; ctx.fill();
        });
        // Shield ring
        if(e.health/e.maxHealth>0.5){
            const sa=e.shieldAngle||0;
            for(let i=0;i<8;i++){
                const a=sa+i*Math.PI/4;
                ctx.beginPath(); ctx.arc(Math.cos(a)*58,Math.sin(a)*58,7,0,Math.PI*2);
                ctx.fillStyle='rgba(0,200,255,.45)'; ctx.fill();
            }
        }
    }

    // HP bar (boss — wide, prominent)
    const bw=e.w+20, rat=e.health/e.maxHealth;
    ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(-bw/2-4,-e.h/2-26,bw+8,12);
    const hg=ctx.createLinearGradient(-bw/2,-e.h/2-26,bw/2,-e.h/2-26);
    hg.addColorStop(0,'#ff2200'); hg.addColorStop(.5,'#ffaa00'); hg.addColorStop(1,'#00ff88');
    ctx.fillStyle=hg; ctx.fillRect(-bw/2,-e.h/2-24,bw*rat,8);
    ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1; ctx.strokeRect(-bw/2,-e.h/2-24,bw,8);
    // Boss name
    ctx.fillStyle='#fff'; ctx.font='bold 13px Segoe UI'; ctx.textAlign='center'; ctx.direction='rtl';
    ctx.fillText(`👾 ${bd.name}`, 0, -e.h/2-30);
    ctx.direction='ltr';

    ctx.restore();
}

// ── Draw: Bullet ─────────────────────────────────────────
function drawBullet(b) {
    ctx.save(); ctx.shadowColor=b.color; ctx.shadowBlur=12;
    const g=ctx.createLinearGradient(b.x,b.y,b.x+(b.vx||0)*3,b.y-b.len);
    g.addColorStop(0,b.color); g.addColorStop(1,'rgba(255,255,0,0)');
    ctx.strokeStyle=g; ctx.lineWidth=b.w; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x+(b.vx||0)*3,b.y-b.len);
    ctx.stroke(); ctx.restore();
}

// ── Draw: Enemy bullet ────────────────────────────────────
function drawEnemyBullet(b) {
    ctx.save(); ctx.shadowColor='#ff4400'; ctx.shadowBlur=10;
    ctx.fillStyle='#ff6600'; ctx.beginPath(); ctx.arc(b.x,b.y,5,0,Math.PI*2); ctx.fill();
    ctx.restore();
}

// ── Draw: Powerup ─────────────────────────────────────────
function drawPowerup(p) {
    ctx.save(); ctx.translate(p.x,p.y);
    const pulse=.8+.2*Math.sin(Date.now()/200); ctx.scale(pulse,pulse);
    ctx.shadowColor=p.color; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2);
    ctx.fillStyle=`${p.color}33`; ctx.fill();
    ctx.strokeStyle=p.color; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=p.color; ctx.font='bold 17px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.icon,0,1);
    ctx.restore();
}

// ── Alien type definitions (shared with encyclopedia) ─────
const ALIEN_TYPES = [
    {id:'zrix',  name:'זריקס',  nameEn:'Zrix Scout',   color:'#ff44aa', dark:'#aa0066', hp:1, speed:1.2, pts:10, w:44, h:36, desc:'סייר מהיר. מגיע ראשון ויורה לעיתים נדירות.', tip:'קל להפיל — גמור אותו מהר לפני שמגיעים אחרים.', ability:'מהירות גבוהה'},
    {id:'gloob', name:'גלוב',   nameEn:'Gloob Soldier', color:'#44ffaa', dark:'#006633', hp:2, speed:0.9, pts:20, w:50, h:40, desc:'חייל מנוסה. יותר חזק ויורה לעיתים קרובות.', tip:'תמקד קודם כשיש הרבה על המסך.', ability:'ירי מהיר'},
    {id:'kraven',name:'קראבן', nameEn:'Kraven Commander', color:'#ffaa44', dark:'#aa5500', hp:3, speed:0.7, pts:30, w:56, h:44, desc:'מפקד כבד. איטי אבל עמיד מאוד ומסוכן.', tip:'צריך 3 פגיעות — השתמש בנשק רמה 2+.', ability:'שריון כפול'},
];

// ── Boss definitions ──────────────────────────────────────
const BOSS_DEFS = [
    {id:'vorex',  name:'ורקס',    nameEn:'Commander Vorex',  color:'#ff2200', dark:'#880000', hpBase:20, w:110, h:80, pts:500, level:5,  desc:'מפקד צבאי מהגלקסיה השלישית. יורה בפרץ מאוורר.', tip:'הימנע מהאמצע — היצמד לצדדים.', ability:'ירי מניפה x5'},
    {id:'nexis',  name:'נקסיס',   nameEn:'Hive Queen Nexis', color:'#aa44ff', dark:'#550088', hpBase:35, w:130, h:100, pts:900, level:10, desc:'מלכת הכוורת. מגדלת חייזרים ושולחת אותם לקרב.', tip:'תירה לה ישר — אל תתעסק עם המיניונים.', ability:'מזמן מיניונים'},
    {id:'omega',  name:'אומגה',   nameEn:'Omega Destroyer',  color:'#00ccff', dark:'#003355', hpBase:55, w:150, h:120, pts:1500, level:15, desc:'משמיד אולטימטיבי. לייזרים, מגן, הכל.', tip:'כשהמגן נכבה — תירה בכל הכוח!', ability:'מגן + לייזר'},
];

// ── Spawn helpers ─────────────────────────────────────────
let bossActive = false;
let bossSpawned = {}; // track which boss levels triggered

function spawnEnemy() {
    let idx=0;
    if(level>=3) idx=Math.floor(Math.random()*2);
    if(level>=5) idx=Math.floor(Math.random()*3);
    const t=ALIEN_TYPES[idx], mult=Math.ceil(level/2);
    enemies.push({
        x:t.w/2+Math.random()*(W-t.w), y:-t.h,
        w:t.w, h:t.h, color:t.color, dark:t.dark,
        alienId:t.id,
        health:t.hp*mult, maxHealth:t.hp*mult,
        speed:t.speed+(level-1)*.15,
        score:t.pts*level,
        vx:(Math.random()-.5)*1.5,
        phase:Math.random()*Math.PI*2,
        isBoss:false
    });
}

function spawnBoss(def) {
    bossActive = true;
    const hp = def.hpBase * Math.ceil(level/5);
    enemies.push({
        x:W/2, y:-def.h,
        w:def.w, h:def.h, color:def.color, dark:def.dark,
        alienId:def.id,
        health:hp, maxHealth:hp,
        speed:0.55 + (level/30),
        score:def.pts * level,
        vx:0.8, phase:0,
        isBoss:true, bossDef:def,
        shieldAngle:0, shootPhase:0,
        spawnsMinions: def.id==='nexis',
        minionsTimer: 0,
    });
}

function spawnPowerup(x,y) {
    if(Math.random()>.3) return;
    const types=[
        {type:'heart', icon:'❤️', color:'#ff4488', effect:()=>{lives=Math.min(lives+1,5);}},
        {type:'weapon',icon:'⚡', color:'#ffdd00', effect:()=>{weaponLevel=Math.min(weaponLevel+1,3);weaponTimer=600;}},
        {type:'shield',icon:'🛡️', color:'#44aaff', effect:()=>{shieldActive=true;shieldTimer=400;}},
    ];
    const t=types[Math.floor(Math.random()*types.length)];
    powerups.push({x,y,vy:1.5,...t});
}

// ── Shooting ──────────────────────────────────────────────
function shoot() {
    if(shootCooldown>0) return;
    const col=weaponLevel>=3?'#ff4400':weaponLevel>=2?'#ffaa00':'#ffff44';
    const bw=weaponLevel>=3?5:weaponLevel>=2?4:3;
    const bl=weaponLevel>=3?22:18;
    const sp=12;
    if(weaponLevel===1){
        bullets.push({x:player.x,y:player.y-30,vy:-sp,vx:0,color:col,w:bw,len:bl,dmg:1});
    } else if(weaponLevel===2){
        bullets.push({x:player.x-10,y:player.y-25,vy:-sp,vx:0,color:col,w:bw,len:bl,dmg:1});
        bullets.push({x:player.x+10,y:player.y-25,vy:-sp,vx:0,color:col,w:bw,len:bl,dmg:1});
    } else {
        bullets.push({x:player.x,y:player.y-30,vy:-sp,vx:0,color:col,w:bw,len:bl,dmg:2});
        bullets.push({x:player.x-14,y:player.y-20,vy:-sp,vx:-1,color:col,w:bw-1,len:bl,dmg:1});
        bullets.push({x:player.x+14,y:player.y-20,vy:-sp,vx:1,color:col,w:bw-1,len:bl,dmg:1});
    }
    shootCooldown=weaponLevel>=3?8:weaponLevel>=2?12:18;
}

// ── Hit player ────────────────────────────────────────────
function hitPlayer() {
    if(invincible||shieldActive) return;
    lives--;
    invincible=true; invincibleTimer=120;
    createParticles(player.x,player.y,'#ff4444',20);
    if(lives<=0){ lives=0; triggerGameOver(); }
}

// ── Game Over ─────────────────────────────────────────────
function triggerGameOver() {
    gameOver=true;
    gameRunning=false; // stop the loop

    const qualified = isTopTen(score);
    overlay.innerHTML='';

    const h1=document.createElement('h1'); h1.textContent='💥 משחק נגמר!'; overlay.appendChild(h1);
    const scoreP=document.createElement('p');
    scoreP.innerHTML=`ניקוד: <span style="color:#ffdd00;font-size:24px;">${score.toLocaleString()}</span>`;
    scoreP.style.cssText='font-size:18px;color:#fff;margin:12px 0 4px';
    overlay.appendChild(scoreP);
    const lvlP=document.createElement('p'); lvlP.textContent=`הגעת לשלב ${level}`; overlay.appendChild(lvlP);

    // Leaderboard div placeholder
    const lbDiv=document.createElement('div'); lbDiv.id='leaderboard'; overlay.appendChild(lbDiv);

    if(qualified){
        // Name input
        const area=document.createElement('div'); area.id='nameInputArea';
        area.innerHTML=`<p>🎉 נכנסת לטבלת השיאים!</p>
            <input id="nameInput" type="text" maxlength="16" placeholder="מה שמך?" />
            <button id="submitName">✔ שמור</button>`;
        overlay.appendChild(area);
        setTimeout(()=>{ document.getElementById('nameInput') && document.getElementById('nameInput').focus(); },200);
        document.getElementById('submitName').onclick=()=>submitScore();
        document.getElementById('nameInput').onkeydown=e=>{ if(e.key==='Enter') submitScore(); };
    } else {
        renderLeaderboard(score);
    }

    const restartBtn=document.createElement('button');
    restartBtn.className='btn btn-red'; restartBtn.textContent='🔄 שחק שוב';
    restartBtn.style.marginTop='14px';
    restartBtn.onclick=startGame;
    overlay.appendChild(restartBtn);

    overlay.style.display='flex';
}

function submitScore() {
    const input=document.getElementById('nameInput');
    const name=(input?input.value.trim():'')||'אנונימי';
    addScore(name, score, level);
    // remove input area
    const area=document.getElementById('nameInputArea');
    if(area) area.remove();
    renderLeaderboard(score);
}

// ── Update ────────────────────────────────────────────────
function update() {
    // Player move
    if(!useMouseControl){
        if(keys['ArrowLeft']||keys['a']) player.x-=player.speed;
        if(keys['ArrowRight']||keys['d']) player.x+=player.speed;
        if(keys['ArrowUp']||keys['w']) player.y-=player.speed;
        if(keys['ArrowDown']||keys['s']) player.y+=player.speed;
    } else {
        player.x+=(mouseX-player.x)*.12;
    }
    player.x=Math.max(22,Math.min(W-22,player.x));
    player.y=Math.max(30,Math.min(H-30,player.y));

    // Shoot
    if(shootCooldown>0) shootCooldown--;
    if(spaceHeld||mouseHeld) shoot();

    // Timers
    if(shieldTimer>0){ shieldTimer--; if(shieldTimer<=0) shieldActive=false; }
    if(weaponTimer>0){ weaponTimer--; if(weaponTimer<=0) weaponLevel=1; }
    if(invincibleTimer>0){ invincibleTimer--; if(invincibleTimer<=0) invincible=false; }

    // Boss spawn check (every level 5, 10, 15...)
    if(!bossActive && level>=5 && level%5===0 && !bossSpawned[level]){
        bossSpawned[level]=true;
        const bossIdx = Math.min(Math.floor(level/5)-1, BOSS_DEFS.length-1);
        spawnBoss(BOSS_DEFS[bossIdx]);
    }

    // Normal spawn (skip if boss on screen)
    if(!bossActive && ++spawnTimer>=spawnRate){
        spawnTimer=0; spawnEnemy();
        if(Math.random()<.3) spawnEnemy();
        spawnRate=Math.max(35,120-level*8);
    }

    // Enemy shoot
    if(++enemyShootTimer>=Math.max(30,90-level*5)){
        enemyShootTimer=0;
        const ss=enemies.filter(e=>e.y>0);
        if(ss.length){
            const sh=ss[Math.floor(Math.random()*ss.length)];
            const dx=player.x-sh.x, dy=player.y-sh.y, d=Math.sqrt(dx*dx+dy*dy);
            enemyBullets.push({x:sh.x,y:sh.y+20,vx:(dx/d)*4,vy:(dy/d)*4});
        }
    }

    // Stars
    stars.forEach(s=>{ s.y+=s.speed; if(s.y>H){s.y=0;s.x=Math.random()*W;} });

    // Player bullets
    bullets=bullets.filter(b=>{
        b.x+=b.vx||0; b.y+=b.vy;
        return b.y>-30&&b.y<H+20&&b.x>-20&&b.x<W+20;
    });

    // Enemy bullets
    enemyBullets=enemyBullets.filter(b=>{
        b.x+=b.vx; b.y+=b.vy;
        if(!invincible&&Math.abs(b.x-player.x)<20&&Math.abs(b.y-player.y)<25){ hitPlayer(); return false; }
        return b.y<H+20&&b.y>-20&&b.x>-10&&b.x<W+10;
    });

    // Enemies
    enemies=enemies.filter(e=>{
        e.x+=e.vx; e.y+=e.speed;
        if(e.x<e.w/2||e.x>W-e.w/2) e.vx*=-1;

        // Boss-specific behaviour
        if(e.isBoss){
            e.shieldAngle=(e.shieldAngle||0)+0.03;
            // Nexis spawns minions periodically
            if(e.spawnsMinions){ e.minionsTimer++; if(e.minionsTimer>200){ e.minionsTimer=0; spawnEnemy(); spawnEnemy(); } }
        }

        // Bullet hits — boss with shield halves damage when hp>50%
        for(let i=bullets.length-1;i>=0;i--){
            const b=bullets[i];
            if(Math.abs(b.x-e.x)<e.w/2&&Math.abs(b.y-e.y)<e.h/2){
                let dmg=b.dmg||1;
                if(e.isBoss && e.health/e.maxHealth>0.5 && e.bossDef.id==='omega') dmg=Math.max(1,dmg-1);
                e.health-=dmg; createParticles(b.x,b.y,e.color,5); bullets.splice(i,1);
            }
        }
        if(e.health<=0){
            score+=e.score; createParticles(e.x,e.y,e.color,e.isBoss?50:20); spawnPowerup(e.x,e.y);
            if(e.isBoss){ bossActive=false; score+=e.bossDef.pts; level++; }
            if(score>=level*500) level++;
            return false;
        }
        // Collide with player
        if(!invincible&&Math.abs(e.x-player.x)<(e.isBoss?50:30)&&Math.abs(e.y-player.y)<(e.isBoss?50:35)){
            if(shieldActive){ e.health-=5; createParticles(e.x,e.y,'#44aaff',10); }
            else { e.health-=2; hitPlayer(); createParticles(e.x,e.y,e.color,12); }
        }
        return e.y<H+80;
    });

    // Powerups
    powerups=powerups.filter(p=>{
        p.y+=p.vy;
        if(Math.abs(p.x-player.x)<30&&Math.abs(p.y-player.y)<30){ p.effect(); createParticles(p.x,p.y,p.color,14); return false; }
        return p.y<H+30;
    });

    // Particles
    particles=particles.filter(p=>{
        p.x+=p.vx; p.y+=p.vy; p.vx*=.95; p.vy*=.95; p.life-=p.decay; return p.life>0;
    });
}

// ── Draw ──────────────────────────────────────────────────
function draw() {
    ctx.fillStyle='#000010'; ctx.fillRect(0,0,W,H);

    // Stars
    stars.forEach(s=>{
        ctx.globalAlpha=s.opacity; ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill();
    }); ctx.globalAlpha=1;

    // Particles
    particles.forEach(p=>{
        ctx.globalAlpha=p.life; ctx.fillStyle=p.color;
        ctx.shadowColor=p.color; ctx.shadowBlur=6;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill();
    }); ctx.globalAlpha=1; ctx.shadowBlur=0;

    powerups.forEach(drawPowerup);
    enemyBullets.forEach(drawEnemyBullet);
    bullets.forEach(drawBullet);
    enemies.forEach(drawAlien);
    drawRocket(player.x, player.y);
    drawHUD();
    ctx.shadowBlur=0;
}

function drawHUD() {
    ctx.fillStyle='rgba(0,0,30,.75)'; ctx.fillRect(0,0,W,55);
    // Score
    ctx.fillStyle='#fff'; ctx.font='bold 18px Segoe UI'; ctx.textAlign='left';
    ctx.fillText(`ניקוד: ${score.toLocaleString()}`,15,30);
    // Level
    ctx.textAlign='center'; ctx.fillStyle='#00cfff';
    ctx.fillText(`שלב ${level}`,W/2,30);
    // Lives
    for(let i=0;i<lives;i++){
        ctx.font='20px Arial'; ctx.textAlign='right';
        ctx.fillText('❤️',W-15-i*26,32);
    }
    // Shield
    if(shieldActive){
        ctx.fillStyle='#44aaff'; ctx.font='bold 12px Segoe UI'; ctx.textAlign='left';
        ctx.fillText(`🛡️ ${Math.ceil(shieldTimer/60)}s`,15,50);
    }
    // Weapon
    if(weaponLevel>1){
        ctx.fillStyle=weaponLevel>=3?'#ff4400':'#ffaa00';
        ctx.font='bold 12px Segoe UI'; ctx.textAlign='center';
        ctx.fillText(`⚡ ${weaponLevel===3?'MAX':'x2'} ${Math.ceil(weaponTimer/60)}s`,W/2,50);
    }
}

// ── Game loop ─────────────────────────────────────────────
function gameLoop() {
    if(!gameRunning) return;   // ← stop when game ends
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function startGame() {
    overlay.style.display='none';
    init();
    gameRunning=true;
    gameLoop();
}

// ── Controls ──────────────────────────────────────────────
document.addEventListener('keydown',e=>{ keys[e.key]=true; if(e.key===' '){e.preventDefault();spaceHeld=true;} });
document.addEventListener('keyup', e=>{ keys[e.key]=false; if(e.key===' ') spaceHeld=false; });
canvas.addEventListener('mousemove',e=>{ const r=canvas.getBoundingClientRect(); mouseX=(e.clientX-r.left)*(W/r.width); });
canvas.addEventListener('mousedown',e=>{ if(e.button===0) mouseHeld=true; });
canvas.addEventListener('mouseup',  e=>{ if(e.button===0) mouseHeld=false; });

controlToggle.addEventListener('click',()=>{
    useMouseControl=!useMouseControl;
    controlToggle.textContent=useMouseControl?'⌨️ עבור לחיצים':'🖱️ עבור לעכבר';
});

document.getElementById('startBtn').addEventListener('click', startGame);

// Show leaderboard on start screen
renderLeaderboard(null);
</script>
